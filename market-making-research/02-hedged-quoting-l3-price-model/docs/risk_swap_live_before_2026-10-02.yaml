  liq_impact_window_s: 60
  volatility_alert_pct: "0.03"          # IT-06 1min 波动告警

htx:                                               # 2026-09-15 新链路,参照 KuCoin 保守档
  max_order_notional: "20000"
  max_position_notional_per_symbol: "80000"
  max_leverage: {default: "5"}
  min_margin_ratio: "2.0"
  margin_call_tiers: ["3.5", "2.5", "2.0", "1.5"]
